<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Exitoso - ChipTelcel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .telcel-blue { background-color: #0033A0; }
        .telcel-blue-text { color: #0033A0; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-check text-4xl text-green-600"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-3">¡Pago Exitoso!</h1>
        <p class="text-gray-600 mb-2">Tu compra se ha procesado correctamente.</p>
        <p class="text-sm text-gray-500 mb-6">Recibirás un correo con los detalles de tu pedido y las instrucciones de activación del chip.</p>
        
        <div id="payment-info" class="bg-gray-50 rounded-xl p-4 mb-6 text-left text-sm hidden">
            <p class="mb-1"><strong>ID de pago:</strong> <span id="payment-id">-</span></p>
            <p class="mb-1"><strong>Estado:</strong> <span id="status">Aprobado</span></p>
            <p><strong>Referencia:</strong> <span id="external-ref">-</span></p>
        </div>

        <a href="/" class="inline-block telcel-blue text-white font-bold px-8 py-3 rounded-xl hover:opacity-90 transition">
            Volver a la tienda
        </a>
    </div>

    <script>
        // Limpiar carrito al pagar exitosamente
        localStorage.removeItem('chiptelcel_cart');

        // Obtener parámetros de la URL de Mercado Pago
        const params = new URLSearchParams(window.location.search);
        const paymentId = params.get('payment_id') || params.get('collection_id');
        const status = params.get('status') || params.get('collection_status');
        const externalRef = params.get('external_reference');

        if (paymentId || status || externalRef) {
            document.getElementById('payment-info').classList.remove('hidden');
            if (paymentId) document.getElementById('payment-id').textContent = paymentId;
            if (status) document.getElementById('status').textContent = status;
            if (externalRef) document.getElementById('external-ref').textContent = externalRef;
        }
    </script>
</body>
</html>
