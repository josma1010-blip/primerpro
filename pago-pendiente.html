<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Pendiente - ChipTelcel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .telcel-blue { background-color: #0033A0; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
        <div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-clock text-4xl text-yellow-600"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-3">Pago pendiente</h1>
        <p class="text-gray-600 mb-2">Tu pago está siendo procesado.</p>
        <p class="text-sm text-gray-500 mb-6">
            Si elegiste OXXO, SPEI u otro método offline, completa el pago siguiendo las instrucciones que recibiste. 
            Una vez confirmado, te enviaremos el chip.
        </p>
        
        <a href="/" class="inline-block telcel-blue text-white font-bold px-8 py-3 rounded-xl hover:opacity-90 transition">
            Volver a la tienda
        </a>
    </div>
</body>
</html>
