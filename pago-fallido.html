<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Fallido - ChipTelcel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .telcel-blue { background-color: #0033A0; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
        <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-times text-4xl text-red-600"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-3">Pago no completado</h1>
        <p class="text-gray-600 mb-6">Hubo un problema al procesar tu pago. No se realizó ningún cargo. Puedes intentar de nuevo.</p>
        
        <div class="flex flex-col gap-3">
            <a href="/" class="telcel-blue text-white font-bold px-8 py-3 rounded-xl hover:opacity-90 transition">
                Intentar de nuevo
            </a>
            <a href="https://wa.me/525512345678" target="_blank" class="border-2 border-gray-300 text-gray-700 font-medium px-8 py-3 rounded-xl hover:bg-gray-50 transition">
                Contactar soporte
            </a>
        </div>
    </div>
</body>
</html>
